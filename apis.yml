name: Rebag
description: >-
  Rebag is an online marketplace for buying, selling, and trading pre-owned
  luxury goods — designer handbags, watches, fine jewelry, shoes, apparel, and
  accessories from houses such as Chanel, Hermes, Louis Vuitton, Prada, Goyard,
  and Gucci. Founded in 2014 and headquartered in New York City, Rebag
  authenticates every item in-house and is known for Clair (Comprehensive
  Luxury Appraisal Index for Resale), an AI-driven pricing engine that gives
  sellers instant, guaranteed buyback quotes. Rebag operates a mobile app,
  physical retail stores, and consignment/trade-in programs, and is backed by
  investors including General Catalyst. This profile tracks Rebag's public web
  presence; no public developer API has been identified.
